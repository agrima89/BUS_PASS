<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print · {short} Bus Pass</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/card.css">
  <style id="pageSize">@page { size: A4 portrait; margin: 0; }</style>
  <style>
    .print-area { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 16px 48px; overflow-x: auto; }
    .page { background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.5); flex-shrink: 0; }
    .page-label { color: var(--muted); font-size: 12px; margin-bottom: -16px; text-transform: uppercase; letter-spacing: .08em; }
    .print-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .print-bar .sub { margin-right: auto; }
    @media print {
      html, body { background: #fff !important; }
      .print-bar, .page-label, #flash { display: none; }
      .print-area { padding: 0; gap: 0; display: block; }
      .page { box-shadow: none; break-after: page; page-break-after: always; }
      .page:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="print-bar">
    <span class="sub" id="info">Preparing…</span>
    <button class="btn" id="mirrorBtn" hidden></button>
    <a class="btn" href="javascript:history.back()">← Back</a>
    <button class="btn btn-primary" id="printBtn" disabled>⎙ Print / Save as PDF</button>
  </div>
  <div class="flashes" id="flash"></div>
  <div class="print-area" id="area"></div>
<script src="/vendor/supabase-2.45.4.js"></script>
<script src="/vendor/qrcode-generator-1.4.4.js"></script>
<script src="/js/cardfit.js"></script>
<script type="module">
  import { boot, esc, flash, errText, loadSettings, loadCards, cardFront, cardBack, cropMarks, missingFor, params, $ } from "/js/core.js";
  await boot({ auth: true });
  const layout = params.get("layout") === "single" ? "single" : "a4";
  const mirror = params.get("mirror") !== "0";
  const ids = [...new Set((params.get("ids") || "").split(",").map(Number).filter(Number.isInteger))].slice(0, 200);

  // A4 grid (mm): 2 x 2 cards, centred, 6 mm gaps. Long-edge duplex flips left<->right,
  // so each back goes in the mirrored column.
  const X0 = 16.4, Y0 = 20, GAP = 6;
  const SLOTS = [0, 1, 2, 3].map(i => [+(X0 + (i % 2) * (85.6 + GAP)).toFixed(1), +(Y0 + Math.floor(i / 2) * (54 + GAP)).toFixed(1)]);
  const BACK_SLOTS = mirror ? SLOTS.map((_, i) => SLOTS[i ^ 1]) : SLOTS;

  try {
    if (!ids.length) throw new Error("No passes selected.");
    const [settings, items] = await Promise.all([loadSettings(), loadCards(ids)]);
    const bad = items.filter(i => i.pass.status !== "valid").map(i => `${i.pass.pass_code} (${i.pass.status})`);
    const incomplete = items.filter(i => missingFor(i.pass.students).length)
      .map(i => `${i.pass.students.full_name} (${missingFor(i.pass.students).join(", ")})`);
    if (bad.length) throw new Error(`These passes can't be printed: ${bad.join("; ")}.`);
    if (incomplete.length) throw new Error(`Complete these students before printing: ${incomplete.join("; ")}.`);

    const area = $("#area");
    if (layout === "single") {
      $("#pageSize").textContent = "@page { size: 85.6mm 54mm; margin: 0; }";
      const c = items[0].card;
      area.innerHTML = `<div class="page-label">Front</div><div class="page bp-single">${cardFront(c, settings)}</div>
                        <div class="page-label">Back</div><div class="page bp-single">${cardBack(c, settings)}</div>`;
      $("#info").innerHTML = `Pass ${esc(items[0].pass.pass_code)}: page 1 front, page 2 back, each 85.6 × 54 mm (duplex on a card printer).`;
    } else {
      let html = "";
      for (let g = 0; g < items.length; g += 4) {
        const group = items.slice(g, g + 4), n = g / 4 + 1;
        html += `<div class="page-label">Sheet ${n}, fronts</div><div class="page bp-sheet">${
          group.map((it, i) => `<div class="bp-slot" style="left:${SLOTS[i][0]}mm;top:${SLOTS[i][1]}mm">${cardFront(it.card, settings)}</div>`).join("")
        }${cropMarks(SLOTS.slice(0, group.length))}</div>`;
        html += `<div class="page-label">Sheet ${n}, backs</div><div class="page bp-sheet">${
          group.map((it, i) => `<div class="bp-slot" style="left:${BACK_SLOTS[i][0]}mm;top:${BACK_SLOTS[i][1]}mm">${cardBack(it.card, settings)}</div>`).join("")
        }${cropMarks(BACK_SLOTS.slice(0, group.length))}</div>`;
      }
      area.innerHTML = html;
      $("#info").innerHTML = `${items.length} card(s) on ${Math.ceil(items.length / 4)} A4 sheet(s): fronts, then backs${mirror ? ", backs mirrored for long-edge duplex" : ""}.`;
      const mb = $("#mirrorBtn");
      mb.hidden = false; mb.textContent = mirror ? "Don’t mirror backs" : "Mirror backs";
      mb.onclick = () => { params.set("mirror", mirror ? "0" : "1"); location.search = params.toString(); };
    }
    $("#info").insertAdjacentHTML("beforeend", "<br>In the print dialog set <b>Scale 100%</b>, <b>Margins: None</b>, <b>Background graphics: on</b>. Choose <b>Save as PDF</b> for a PDF file.");
    // Wait for photos to load so nothing prints blank.
    await Promise.all([...document.images].map(img => img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })));
    window.BuggyCard.fitCards();
    $("#printBtn").disabled = false;
    $("#printBtn").onclick = () => window.print();
    document.body.dataset.ready = "1";       // lets automated PDF tests know rendering is done
  } catch (e) { $("#info").textContent = "Nothing to print."; flash(errText(e), "error"); }
</script>
</body>
</html>
